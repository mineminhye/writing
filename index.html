<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통계로 말하는 나의 의견</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#26303b; --sub:#66707c; --line:#dedad2;
  --main:#2f6f8f; --main2:#e3f0f6; --pro:#2f8f5b; --con:#c2512f; --star:#e6a700;
  --g:#2f8f5b; --y:#d29b00; --r:#c2512f; --home:#d7263d;
}
*{box-sizing:border-box}
html{font-size:22px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;line-height:1.55;word-break:keep-all}
h1,h2,h3,.jua,button,.step{font-family:'Jua','Malgun Gothic',sans-serif;font-weight:400}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--line)}
.top{display:flex;align-items:center;gap:.6rem;padding:.5rem 1rem;flex-wrap:wrap}
.top h1{margin:0;font-size:1.25rem;color:var(--main);flex:1;min-width:10rem}
.who{font-size:.75rem;color:var(--sub)}
.fs button{width:2.2rem;height:2.2rem;padding:0;font-size:.8rem}
nav{display:flex;overflow-x:auto;gap:.3rem;padding:0 1rem .5rem}
.step{flex:1 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:.25rem .8rem;font-size:.85rem;color:var(--sub);cursor:pointer;white-space:nowrap}
.step.on{background:var(--main);border-color:var(--main);color:#fff}
.step.done{border-color:var(--main);color:var(--main)}
main{max-width:1100px;margin:0 auto;padding:1rem 1rem 6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1rem 1.1rem;margin-bottom:1rem;box-shadow:0 2px 0 rgba(0,0,0,.03)}
h2{font-size:1.35rem;margin:.1rem 0 .6rem;color:var(--main)}
h3{font-size:1.1rem;margin:.2rem 0 .5rem}
.lead{color:var(--sub);font-size:.85rem;margin:-.3rem 0 .8rem}
button{font-size:.9rem;border:2px solid var(--main);background:#fff;color:var(--main);border-radius:12px;padding:.35rem .8rem;cursor:pointer;touch-action:manipulation}
button.fill{background:var(--main);color:#fff}
button:disabled{opacity:.4;cursor:default}
button.mini{font-size:.75rem;padding:.15rem .5rem;border-radius:9px}
input[type=text],input[type=number],textarea,select{font:inherit;font-size:.95rem;border:2px solid var(--line);border-radius:10px;padding:.35rem .55rem;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:5.5rem;resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--main)}
label{font-size:.85rem;color:var(--sub)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.dsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.7rem}
.ds{border:2px solid var(--line);border-radius:16px;padding:.7rem .8rem;cursor:pointer;background:#fff}
.ds.on{border-color:var(--main);background:var(--main2)}
.ds b{font-family:'Jua';font-weight:400;font-size:1.05rem}
.ds .no{display:inline-block;background:var(--main);color:#fff;border-radius:8px;padding:0 .45rem;margin-right:.3rem;font-family:'Jua'}
.ds small{display:block;color:var(--sub);font-size:.75rem}
.topic{border:2px solid var(--line);border-radius:16px;padding:.8rem .9rem;margin-bottom:.7rem;background:#fff}
.topic.star{border-color:var(--star);background:#fffaf0}
.topic .t{font-size:1.05rem;font-weight:700;margin:.2rem 0 .4rem}
.badge{display:inline-block;font-size:.72rem;border-radius:999px;padding:.05rem .6rem;color:#fff;font-family:'Jua'}
.badge.g{background:var(--g)}.badge.y{background:var(--y)}.badge.r{background:var(--r)}
.hint{font-size:.8rem;color:var(--sub);margin:.1rem 0 .5rem}
.pick button.on.pro{background:var(--pro);border-color:var(--pro);color:#fff}
.pick button.on.con{background:var(--con);border-color:var(--con);color:#fff}
.pick button.pro{border-color:var(--pro);color:var(--pro)}
.pick button.con{border-color:var(--con);color:var(--con)}
.starbtn{border-color:var(--star);color:#a77a00}
.starbtn.on{background:var(--star);color:#fff}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.78rem;color:var(--sub);margin-bottom:.6rem}
.chips{display:flex;gap:.35rem;flex-wrap:wrap;margin:.3rem 0}
.chip{border:2px solid var(--line);border-radius:999px;padding:.1rem .65rem;font-size:.78rem;background:#fff;color:var(--ink);cursor:pointer;font-family:'Malgun Gothic',sans-serif}
.chip.on{background:var(--main);border-color:var(--main);color:#fff}
svg text{font-family:'Malgun Gothic',sans-serif}
.plot{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:manipulation}
.rbox{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:.6rem 0}
.rnum{font-family:'Jua';font-size:1.8rem;color:var(--main)}
.scale{position:relative;flex:1;min-width:14rem;height:2.6rem}
.scale .bar{position:absolute;left:0;right:0;top:.5rem;height:.7rem;border-radius:9px;background:linear-gradient(90deg,#c2512f,#eee 50%,#2f6f8f)}
.scale .mk{position:absolute;top:.15rem;width:4px;height:1.4rem;background:#222;border-radius:2px;transform:translateX(-2px);transition:left .3s}
.scale .lb{position:absolute;top:1.35rem;font-size:.65rem;color:var(--sub);transform:translateX(-50%);white-space:nowrap}
.info{background:#f2f7fa;border-radius:12px;padding:.5rem .8rem;font-size:.85rem;min-height:2.6rem}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{border:1px solid var(--line);padding:.3rem .4rem;text-align:center}
th{background:#f1efe9;font-weight:700}
td.l{text-align:left}
.tbl-wrap{max-height:22rem;overflow:auto;border-radius:10px}
.basket{background:#fffaf0;border:2px dashed var(--star);border-radius:14px;padding:.6rem .8rem}
.bitem{display:flex;gap:.4rem;align-items:flex-start;font-size:.82rem;padding:.3rem 0;border-bottom:1px dashed #ecd9a6}
.bitem:last-child{border-bottom:0}
.bitem span{flex:1}
.para{border-left:6px solid var(--main);padding-left:.8rem}
.pnum{display:inline-block;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--main);color:#fff;text-align:center;font-family:'Jua';line-height:1.7rem;margin-right:.3rem}
.q{font-size:.9rem;color:var(--sub);margin:.1rem 0 .5rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
@media (max-width:820px){.fields{grid-template-columns:1fr}}
.limits{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin:.5rem 0}
@media (max-width:820px){.limits{grid-template-columns:1fr 1fr}}
.lcard{perspective:800px;height:9.5rem;cursor:pointer}
.lin{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.lcard.flip .lin{transform:rotateY(180deg)}
.lf,.lb2{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:.6rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.lf{background:var(--main);color:#fff;font-family:'Jua';font-size:1.3rem}
.lf small{font-family:'Malgun Gothic';font-size:.65rem;opacity:.85}
.lb2{background:#fff;border:2px solid var(--main);transform:rotateY(180deg);font-size:.72rem;line-height:1.4;justify-content:flex-start;overflow:auto}
.lb2 b{color:var(--main);font-size:.8rem}
.lcard.sel .lf{background:var(--star)}
.lcard.sel .lb2{border-color:var(--star)}
.cmp{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;background:#f7f5f0;border-radius:12px;padding:.5rem .8rem;font-size:.9rem}
.frames{display:flex;flex-direction:column;gap:.35rem;margin:.4rem 0}
.frame{text-align:left;font-family:'Malgun Gothic',sans-serif;font-size:.82rem;border:2px dashed var(--main);border-radius:10px;padding:.3rem .6rem;background:#fbfdfe}
.checks{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.ck{font-size:.75rem;border-radius:999px;padding:.05rem .6rem;background:#eee;color:#777}
.ck.ok{background:#e1f3e8;color:#23784a}
.ref{background:#f7f5f0;border-radius:12px;padding:.5rem .8rem;font-size:.85rem;margin-bottom:.5rem}
.ref b{color:var(--main)}
details.ai{border:2px solid #b9a6e0;border-radius:14px;padding:.4rem .8rem;background:#faf8ff;margin-bottom:1rem}
details.ai summary{cursor:pointer;font-family:'Jua';color:#6a4fb0;font-size:1rem}
.prompt{background:#fff;border:1px solid #ddd3f3;border-radius:10px;padding:.45rem .6rem;margin:.4rem 0;font-size:.8rem;display:flex;gap:.5rem;align-items:flex-start}
.prompt span{flex:1}
.essay-out{font-size:1rem;line-height:1.9;white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem}
.count{font-family:'Jua';font-size:1.2rem}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:.5rem 1rem;display:flex;justify-content:space-between;z-index:20}
.bottom button{font-size:1rem;padding:.4rem 1.2rem}
.toast{position:fixed;left:50%;bottom:5rem;transform:translateX(-50%);background:#26303b;color:#fff;border-radius:999px;padding:.4rem 1rem;font-size:.85rem;opacity:0;transition:opacity .3s;z-index:50;pointer-events:none}
.toast.show{opacity:1}
.warn{color:var(--con);font-size:.8rem}
.muted{color:var(--sub);font-size:.8rem}
#printArea{display:none}
@media print{
  header,main,.bottom,.toast{display:none!important}
  #printArea{display:block;font-size:12pt;padding:0 1cm}
  #printArea h1{font-size:16pt;margin:0 0 .2cm}
  #printArea .pp{line-height:1.8;margin:.2cm 0;white-space:pre-wrap}
}
</style>
</head>
<body>

<div id="printArea"></div>

/* ---------- 통계 계산 ---------- */
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
function median(a){const b=[...a].sort((x,y)=>x-y),n=b.length;return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2;}
function sd(a){const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/a.length);}
function corr(xs,ys){const mx=mean(xs),my=mean(ys);let a=0,b=0,c=0;for(let i=0;i<xs.length;i++){const dx=xs[i]-mx,dy=ys[i]-my;a+=dx*dy;b+=dx*dx;c+=dy*dy;}return a/Math.sqrt(b*c);}
function fmt(v,k){if(v==null||isNaN(v))return '-';const a=Math.abs(v);if(a>=1000)return Math.round(v).toLocaleString('ko-KR');if(a>=100)return (Math.round(v*10)/10).toString();if(a>=10)return (Math.round(v*10)/10).toString();return (Math.round(v*100)/100).toString();}
function vlabel(d,k){return d.vars[k][0];}
function vunit(d,k){return d.vars[k][1];}
function withUnit(d,k,v){const u=vunit(d,k);return fmt(v)+(u?u==='%'?'%':' '+u:'');}

function dataSummary(){
  const d=ds(),ks=numKeys(d),lines=[`자료 ${d.id}번 ${d.title} (${d.rows.length}개 ${d.unit})`];
  lines.push('변수: '+ks.map(k=>vlabel(d,k)+(vunit(d,k)?'('+vunit(d,k)+')':'')).join(', '));
  for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){const a=d.rows.filter(r=>r[ks[i]]!=null&&r[ks[j]]!=null);if(a.length>2)lines.push(`상관계수 ${vlabel(d,ks[i])} × ${vlabel(d,ks[j])}: ${corr(a.map(r=>r[ks[i]]),a.map(r=>r[ks[j]])).toFixed(2)} (${a.length}개)`);}
  const g=groupKeys(d)[0];
  ks.forEach(k=>{const parts=Object.entries(d.groups[g][1]).map(([c,n])=>{const a=d.rows.filter(r=>r[g]===c&&r[k]!=null).map(r=>r[k]);return a.length?`${n} 평균 ${fmt(mean(a))}·중앙값 ${fmt(median(a))}`:''}).filter(Boolean);lines.push(`${vlabel(d,k)}: ${parts.join(' / ')}`);});

  return lines.join('\n');

async function callAI(kind){

      body:JSON.stringify({kind,topic:topicText(),data:dataSummary(),text:kind==='outline'?outlineText():essayText()})});
    const j=await res.json();

}

function pts(){

function outlierSet(P){
  const a=P;if(a.length<4)return new Set();
  const xs=a.map(p=>p.x),ys=a.map(p=>p.y),mx=mean(xs),my=mean(ys),sx=sd(xs),sy=sd(ys);
  return new Set(a.filter(p=>Math.abs(p.x-mx)>2.5*sx||Math.abs(p.y-my)>2.5*sy).map(p=>p.r.name));
}
const PAL=['#2f6f8f','#e07a2f','#3c9b5a','#8a5cc2','#c2408a','#8a7a2f'];
function niceTicks(lo,hi,n=5){if(lo===hi){lo-=1;hi+=1;}const span=hi-lo,step0=span/n,mag=10**Math.floor(Math.log10(step0)),st=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0);const a=Math.floor(lo/st)*st,b=Math.ceil(hi/st)*st,t=[];for(let v=a;v<=b+st/2;v+=st)t.push(+v.toFixed(10));return t;}

  ty.forEach(t=>{s+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(t)}" y2="${Y(t)}" stroke="#eee"/><text x="${ml-6}" y="${Y(t)+4}" font-size="12" text-anchor="end" fill="#666">${fmt(t)}</text>`;});

    const cx=X(p.x),cy=Y(p.y),home=p.r.name===d.home,sel=EX.sel===p.r.name,isO=EX.showOut&&O.has(p.r.name);

  if(EX.sel)showInfo(EX.sel);
}

function repStats(){
  const d=ds(),k=EX.rep,ex=exList(),codes=Object.keys(d.groups[EX.g][1]);

}

  const d=ds(),k=EX.rep,G=repStats();
  let h=`<div style="overflow:auto"><table><tr><th>집단</th><th>개수</th><th>평균</th><th>중앙값</th><th>표준편차</th><th>가장 큰 곳</th><th>가장 작은 곳</th></tr>`;
  G.forEach(g=>{h+=`<tr><td>${g.name}</td><td>${g.n}</td><td>${fmt(g.mean)}</td><td>${fmt(g.med)}</td><td>${fmt(g.sd)}</td><td>${esc(g.mx.name)} (${fmt(g.mx[k])})</td><td>${esc(g.mn.name)} (${fmt(g.mn[k])})</td></tr>`;});
  h+='</table></div>';
  if(d.home){const all=d.rows.filter(r=>r[k]!=null),hr=all.find(r=>r.name===d.home);
    if(hr){const rank=all.filter(r=>r[k]>hr[k]).length+1;h+=`<div class="ref" style="margin-top:.5rem"><b>${d.home}</b>: ${withUnit(d,k,hr[k])} — ${all.length}개 ${d.unit} 중 큰 쪽부터 <b>${rank}위</b> (작은 쪽부터 ${all.length-rank+1}위)</div>`;}
    else h+=`<div class="ref muted">${d.home}는 이 변수 자료가 없어요.</div>`;}
  // 점 그래프
  const all=G[0].vals.map(r=>r[k]),lo=Math.min(...all),hi=Math.max(...all),t=niceTicks(lo,hi),W=640,rowH=46,ml=120,mr=20,H=G.length*rowH+40;
  const X=v=>ml+(v-t[0])/(t[t.length-1]-t[0])*(W-ml-mr);
  let s=`<svg class="plot" viewBox="0 0 ${W} ${H}" style="margin-top:.5rem">`;
  t.forEach(v=>{s+=`<line x1="${X(v)}" x2="${X(v)}" y1="8" y2="${H-28}" stroke="#eee"/><text x="${X(v)}" y="${H-10}" font-size="12" text-anchor="middle" fill="#666">${fmt(v)}</text>`;});
  G.forEach((g,i)=>{const cy=20+i*rowH;
    s+=`<text x="${ml-8}" y="${cy+5}" font-size="13" text-anchor="end" fill="#333">${g.name}</text>`;
    g.vals.forEach((r,j)=>{const home=r.name===d.home;s+=home?`<text x="${X(r[k])}" y="${cy+8}" font-size="20" text-anchor="middle" fill="var(--home)">★</text>`:`<circle cx="${X(r[k])}" cy="${cy+((j%3)-1)*5}" r="4.5" fill="#2f6f8f" fill-opacity=".45"><title>${esc(r.name)} ${fmt(r[k])}</title></circle>`;});
    s+=`<line x1="${X(g.mean)}" x2="${X(g.mean)}" y1="${cy-15}" y2="${cy+15}" stroke="#c2512f" stroke-width="3"/><line x1="${X(g.med)}" x2="${X(g.med)}" y1="${cy-15}" y2="${cy+15}" stroke="#2f8f5b" stroke-width="3" stroke-dasharray="5 3"/>`;
  });
  s+='</svg>';
  h+=s+`<div class="legend" style="margin-top:.3rem"><span><b style="color:#c2512f">━</b> 평균</span><span><b style="color:#2f8f5b">┅</b> 중앙값</span><span>평균과 중앙값이 멀리 떨어져 있으면, 어느 쪽이 대부분의 ${d.unit}를 더 잘 대표할까?</span></div>`;
  document.getElementById('repWrap').innerHTML=h;
}
function addRep(){
  const d=ds(),G=repStats(),k=EX.rep,ex=exList();
  addBasket(`[대푯값] ${vlabel(d,k)}${vunit(d,k)?'('+vunit(d,k)+')':''}${ex.length?' (뺀 곳: '+ex.join(', ')+')':''} → `+G.map(g=>`${g.name} ${g.n}개: 평균 ${fmt(g.mean)}, 중앙값 ${fmt(g.med)}, 표준편차 ${fmt(g.sd)}`).join(' / '));
}
function drawTable(){
  const d=ds(),ks=numKeys(d),ex=exList();let rows=[...d.rows];
  if(EX.sort){rows.sort((a,b)=>{const A=a[EX.sort],B=b[EX.sort];if(A==null)return 1;if(B==null)return -1;return (typeof A==='string'?A.localeCompare(B):A-B)*(EX.sortDesc?-1:1);});}
  let h=`<table><tr><th onclick="sortBy('name')" style="cursor:pointer">${d.unit} ⇅</th>${groupKeys(d).map(g=>`<th>${d.groups[g][0]}</th>`).join('')}${ks.map(k=>`<th onclick="sortBy('${k}')" style="cursor:pointer">${esc(vlabel(d,k))} ⇅</th>`).join('')}</tr>`;
  rows.forEach(r=>{const home=r.name===d.home,o=ex.includes(r.name);h+=`<tr style="${home?'background:#ffecef;font-weight:700':''}${o?';color:#aaa;text-decoration:line-through':''}"><td class="l">${esc(r.name)}</td>${groupKeys(d).map(g=>`<td>${d.groups[g][1][r[g]]}</td>`).join('')}${ks.map(k=>`<td>${r[k]==null?'-':fmt(r[k])}</td>`).join('')}</tr>`;});
  document.getElementById('tblWrap').innerHTML=h+'</table>';
}
function sortBy(k){if(EX.sort===k)EX.sortDesc=!EX.sortDesc;else{EX.sort=k;EX.sortDesc=k!=='name';}drawTable();}
function addBasket(t){if(S.basket.includes(t)){toast('이미 담겨 있어요');return;}S.basket.push(t);save();toast('근거 바구니에 담았어요 ⭐');if(document.getElementById('bk'))drawBasket();}
function drawBasket(){const el=document.getElementById('bk');if(!el)return;
  el.innerHTML=S.basket.length?S.basket.map((b,i)=>`<div class="bitem"><span>${esc(b)}</span><button class="mini" onclick="S.basket.splice(${i},1);save();drawBasket()">빼기</button></div>`).join(''):'<div class="muted">아직 비어 있어요. 위에서 ⭐ 근거 바구니에 담기를 눌러요.</div>';}

/* ---------- 4. 개요 짜기 ---------- */
function viewOutline(){
  const d=ds(),t=topicText(),first=S.stance[S.star];
  const bchips=(n)=>S.basket.length?`<div class="chips"><span class="muted">⭐ 바구니에서 꺼내기:</span>${S.basket.map((b,i)=>`<span class="chip" title="${esc(b)}" onclick="insertBasket(${n},${i})">${esc(b.slice(0,28))}…</span>`).join('')}</div>`:`<div class="muted">자료실에서 근거를 담아 오면 여기서 바로 꺼내 쓸 수 있어요.</div>`;
  const P=(n,extra)=>{const p=PARAS[n-1];return `<div class="card para"><h3><span class="pnum">${n}</span>${p.name}</h3><div class="q">❓ ${p.q}</div>
   <div class="fields"><div><label>개요문 (한 줄, 중심 문장)</label><input type="text" data-b="o.${n}.s"></div>
   <div><label>근거 (키워드·수치)</label><textarea data-b="o.${n}.k" style="min-height:3.2rem"></textarea>${bchips(n)}</div></div>${extra||''}</div>`;};
  const sel=S.o[3].cards;
  const lim=`<div class="limits">${Object.keys(LIMIT_DEF).map(c=>`<div class="lcard ${sel.includes(c)?'sel':''}" id="lc_${c}" onclick="this.classList.toggle('flip')"><div class="lin">
     <div class="lf">${c}<small>${LIMIT_DEF[c]}</small><small style="margin-top:.4rem">눌러서 뒤집기</small></div>
     <div class="lb2"><b>${c}</b>${LIMIT_DEF[c]}<div style="margin-top:.3rem">🔎 ${esc(LIMIT_EX[d.id][c])}</div>
     <button class="mini" style="margin-top:.4rem" onclick="event.stopPropagation();pickCard('${c}')">${sel.includes(c)?'✔ 고름':'이 카드 고르기'}</button></div></div></div>`).join('')}</div>
   <div><label>더 본 자료가 있다면 (그 자료에 의하면 ~)</label><input type="text" data-b="o.3.more" placeholder="예) 다른 자료에 의하면…"></div>`;
  const filled=[1,2,3].every(n=>S.o[n].s.trim());
  const concl=`<div class="cmp"><span>논제 고를 때 내 첫 생각: <b>${first||'(안 정함)'}</b></span>
     <span class="row pick">지금 나의 결론: <button class="pro ${S.o[4].final==='찬성'?'on':''}" onclick="setFinal('찬성')">찬성</button><button class="con ${S.o[4].final==='반대'?'on':''}" onclick="setFinal('반대')">반대</button></span></div>
     ${filled?'':'<div class="warn">1~3문단 개요문을 먼저 쓰고 결론을 정해 봐요.</div>'}
     ${first&&S.o[4].final&&first!==S.o[4].final?'<div class="muted">💡 생각이 바뀌었네요! 무엇 때문에 바뀌었는지 결론에 써 보세요.</div>':''}`;
  return `<div class="card"><h2>🧭 개요 짜기</h2><div class="ref"><b>나의 논제</b> ${esc(t)}<br><span class="muted">자료 ${d.id}번 — ${esc(vlabel(d,d.x))}와(과) ${esc(vlabel(d,d.y))}</span></div>
    <p class="lead">짝 인터뷰: 내가 말로 답하면 짝이 키워드를 받아 적어 주고, 그걸 보고 한 줄 개요문을 써요.</p>
    ${S.think?`<div class="muted">논제 고를 때 쓴 생각: “${esc(S.think)}”</div>`:''}</div>
   ${P(1)}
   ${P(2,`<div class="fields" style="margin-top:.5rem"><div><label>상관계수</label><input type="text" data-b="o.2.r" placeholder="예) -0.55"></div><div><label>대푯값</label><input type="text" data-b="o.2.rep" placeholder="예) OECD 중앙값 ○○"></div></div>`)}
   ${P(3,lim)}
   ${P(4,concl)}
   ${aiPanel('outline')}
   ${aiBox('outline')}`;
}
function insertBasket(n,i){const k=S.o[n].k;S.o[n].k=(k?k+'\n':'')+S.basket[i];save();const el=document.querySelector(`[data-b="o.${n}.k"]`);if(el)el.value=S.o[n].k;toast('근거 칸에 넣었어요');}
function pickCard(c){const a=S.o[3].cards,i=a.indexOf(c);if(i>=0)a.splice(i,1);else a.push(c);save();const el=document.getElementById('lc_'+c);el.classList.toggle('sel');el.querySelector('button').textContent=a.includes(c)?'✔ 고름':'이 카드 고르기';}
function setFinal(v){S.o[4].final=v;save();render();}

/* ---------- 5. 근거문 쓰기 ---------- */
const CHECKS={
 1:[['논제를 밝혔나',t=>t.length>15&&/논제|해야|할까|한다/.test(t)],['무엇과 무엇의 관계인지 썼나',t=>/관계|와\s|과\s/.test(t)]],
 2:[['수치가 들어갔나',t=>/\d/.test(t)],['상관(양·음·없음)을 말했나',t=>/상관|양의|음의|관계가 (거의 )?없/.test(t)],['대푯값·산포도를 썼나',t=>/평균|중앙값|최빈값|표준편차|분산|흩어|퍼져/.test(t)]],
 3:[['이유를 밝혔나',t=>/왜냐하면|때문/.test(t)],['한계 카드 내용을 썼나',t=>/대표|특이점|빼|원인|인과|평균을|한 사람|나라 전체|자료가 (더 )?필요|그 자료에/.test(t)]],
 4:[['찬성/반대를 밝혔나',t=>/찬성|반대/.test(t)],['조건이나 생각의 변화를 썼나',t=>/단,|다만|처음에는|하지만|그러나/.test(t)]]
};
function viewEssay(){
  const t=topicText();
  return `<div class="card"><h2>✍️ 개요문 + 근거문으로 쓰기</h2><p class="lead">문단마다 <b>개요문(중심 문장) 1개</b>를 쓰고, <b>근거문(수치·그래프·자료로 뒷받침하는 문장)</b>을 이어 써요. 문장 틀을 누르면 넣어지고, 빈칸(______, ( ))을 내 말로 채워요.</p>
   <div class="ref"><b>나의 논제</b> ${esc(t)}</div></div>
   ${PARAS.map(p=>`<div class="card para"><h3><span class="pnum">${p.n}</span>${p.name}</h3>
     <div class="ref"><b>개요문</b> ${esc(S.o[p.n].s)||'<span class="warn">개요에서 아직 안 썼어요</span>'}<br><b>근거</b> ${esc(S.o[p.n].k).replace(/\n/g,' / ')||'-'}
      ${p.n===2&&(S.o[2].r||S.o[2].rep)?`<br><b>상관계수</b> ${esc(S.o[2].r)} · <b>대푯값</b> ${esc(S.o[2].rep)}`:''}${p.n===3&&S.o[3].cards.length?`<br><b>고른 한계 카드</b> ${S.o[3].cards.join(', ')}${S.o[3].more?' · '+esc(S.o[3].more):''}`:''}${p.n===4&&S.o[4].final?`<br><b>결론</b> ${S.o[4].final}`:''}</div>
     <div class="frames">${p.frames.map((f,i)=>`<button class="frame" onclick="insFrame(${p.n},${i})">＋ ${esc(f.replace('{논제}',t))}</button>`).join('')}</div>
     ${S.o[p.n].s?`<button class="mini" onclick="insOutline(${p.n})">＋ 내 개요문 넣기</button>`:''}
     <textarea data-b="e.${p.n}" data-live="liveCheck" data-n="${p.n}" style="min-height:7rem;margin-top:.4rem" placeholder="개요문으로 시작하고, 근거문을 이어 써요."></textarea>
     <div class="checks" id="ck${p.n}"></div></div>`).join('')}
   ${aiPanel('essay')}
   ${aiBox('essay')}`;
}
function insFrame(n,i){const f=PARAS[n-1].frames[i].replace('{논제}',topicText());S.e[n]=(S.e[n]?S.e[n].replace(/\s*$/,' '):'')+f;save();const el=document.querySelector(`[data-b="e.${n}"]`);el.value=S.e[n];liveCheck(el);el.focus();}
function insOutline(n){S.e[n]=(S.e[n]?S.e[n].replace(/\s*$/,' '):'')+S.o[n].s;save();const el=document.querySelector(`[data-b="e.${n}"]`);el.value=S.e[n];liveCheck(el);}
function liveCheck(el){const n=+el.dataset.n,t=el.value;const blanks=/_{3,}|\(\s*\)/.test(t);
  document.getElementById('ck'+n).innerHTML=CHECKS[n].map(([l,f])=>`<span class="ck ${f(t)?'ok':''}">${f(t)?'✔':'○'} ${l}</span>`).join('')+(blanks?'<span class="ck" style="background:#fdeaea;color:#c2512f">빈칸이 남아 있어요</span>':'')+`<span class="ck">${t.replace(/\s/g,'').length}자</span>`;}

/* ---------- 6. 완성 ---------- */
const SELF=[
 ['대푯값(또는 산포도)이 우리 자료를 어떻게 대표하는지 썼다. (수치 차이만 쓰지 않기)','[9수05-01] 대푯값과 산포도의 의미'],
 ['산점도를 근거로 두 변수의 관계(양·음·없음)를 말했다.','[9수05-02] 산점도, 상관관계'],
 ['통계 결과를 논제와 연결해 결론을 내고, 자료로 말할 수 있는 범위(한계)를 밝혔다.','통계는 합리적 의사 결정에 활용된다']
];
function fullText(){return [1,2,3,4].map(n=>S.e[n].trim()).filter(Boolean).join('\n\n');}
function viewDone(){
  const txt=fullText(),len=txt.replace(/\s/g,'').length,I=S.info;
  const blanks=/_{3,}|\(\s*\)/.test(txt);
  return `<div class="card"><h2>🎉 완성된 나의 글</h2>
   <div class="ref"><b>논제</b> ${esc(topicText())}  ·  <b>나의 결론</b> ${S.o[4].final||'-'}</div>
   <div class="essay-out">${esc(txt)||'<span class="muted">아직 쓴 글이 없어요. 5단계에서 써 봐요.</span>'}</div>
   <div class="row" style="margin-top:.6rem;justify-content:space-between"><span class="count">${len}자 <span class="muted">(공백 빼고 · 한 쪽을 넘지 않게)</span></span>
    <span class="row"><button onclick="copyText(fullText())">복사하기</button><button onclick="dlTxt()">파일로 저장</button><button class="fill" onclick="doPrint()">인쇄하기</button></span></div>
   ${blanks?'<div class="warn" style="margin-top:.3rem">⚠ 아직 채우지 않은 빈칸(______ 또는 ( ))이 있어요.</div>':''}
  </div>
  <div class="card"><h2>✅ 스스로 점검</h2><p class="lead">이번 단원에서 배운 것을 글에서 썼나요?</p>
   <table><tr><th>점검 내용</th><th>근거 (성취기준)</th><th>✔</th></tr>
   ${SELF.map((s,i)=>`<tr><td class="l">${s[0]}</td><td>${s[1]}</td><td><input type="checkbox" style="width:1.4rem;height:1.4rem" ${S.self[i]?'checked':''} onchange="S.self[${i}]=this.checked;save()"></td></tr>`).join('')}</table>
   ${aiPanel('essay')}
   <p class="muted" style="margin-top:.6rem">정리 시간: 친구들의 논의를 듣고, 다음 시간에 고치고 싶은 문장을 생각해 봐요.</p></div>`;
}
function dlTxt(){const I=S.info;const b=new Blob([`${I.ban}반 ${I.no}번 ${I.name}\n논제: ${topicText()}\n\n${fullText()}`],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`나의의견_${I.ban}반${I.no}번_${I.name||'이름'}.txt`;a.click();}
function doPrint(){const I=S.info;document.getElementById('printArea').innerHTML=`<h1>통계로 말하는 나의 의견</h1><div>${esc(I.ban)}반 ${esc(I.no)}번 이름: ${esc(I.name)} · 자료 ${S.ds}번</div><div><b>논제</b> ${esc(topicText())}</div><hr>${[1,2,3,4].map(n=>`<div class="pp">${esc(S.e[n])}</div>`).join('')}`;window.print();}

/* ---------- 시작 ---------- */
document.documentElement.style.fontSize=(S.fs||22)+'px';
render();
</script>
</body>
</html>
